name: PhotoForge CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore PhotoForge.slnx

      - name: Build solution
        run: dotnet build PhotoForge.slnx -c Release --no-restore

      - name: Run Test Suites
        run: dotnet test tests/PhotoForge.Tests/PhotoForge.Tests.csproj -c Release --no-build --verbosity normal

      - name: Package Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./build/package-releases.ps1 -Version ${{ github.ref_name }}

      - name: Submit Code Signing Request to SignPath.io
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        id: signpath
        uses: SignPath/github-action-submit-signing-request@v1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG || 'photo-forge' }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          parameters: |
            description: 'PhotoForge Release ${{ github.ref_name }}'
            url: 'https://github.com/ramanacr/photo-forge'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.exe
            build/dist/*.zip
            build/dist/SHA256SUMS.txt
            build/sbom.spdx.json
          generate_release_notes: true
